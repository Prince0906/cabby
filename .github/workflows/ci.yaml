# CI (S0): `make check` on every push and pull request; on main, build the linux/arm64 app image and
# push it to GHCR as ghcr.io/<owner>/<repo>/app:sha-<first 7 of the commit>.
#
# Everything here runs on GitHub-hosted runners, so a fork's pull request can run `check` safely.
# Deployment is a separate workflow (cd.yaml, triggered after this one succeeds on main) because the
# repo's rule is that no workflow with a pull_request trigger may contain a self-hosted job.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # scripts/catch-up.sh re-runs CI on main with `gh workflow run ci.yaml`

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.14.8  # what the lab was validated with; versions.tf needs >= 1.11
      - run: make check  # Docker is preinstalled here, so the observability checks run too

  image:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm  # native arm64 build: every lab host is Graviton
    permissions:
      contents: read
      packages: write  # push to GHCR with the workflow's own token
    outputs:
      tag: ${{ steps.img.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Image name and tag
        id: img
        # Tag scheme (decisions/): one immutable tag per commit, sha-<7>. GHCR needs a lowercase path.
        run: |
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: app
          platforms: linux/arm64
          push: true
          tags: ${{ steps.img.outputs.prefix }}/app:${{ steps.img.outputs.tag }}
          build-args: GIT_SHA=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: The pushed image answers with this commit
        run: |
          image="${{ steps.img.outputs.prefix }}/app:${{ steps.img.outputs.tag }}"
          docker run -d --name app -p 8000:8000 -e IMAGE_TAG="${{ steps.img.outputs.tag }}" "$image"
          for _ in $(seq 1 20); do curl -fsS http://localhost:8000/version && break; sleep 1; done
          curl -fsS http://localhost:8000/version | jq -e --arg sha "$GITHUB_SHA" '.git_sha == $sha'
