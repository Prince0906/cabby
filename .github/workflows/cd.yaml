# CD (S0): after CI succeeds on main, run the commit's image on the app host and smoke-test it.
#
# Runs on the app host's self-hosted runner (label lab-app), which uses the host's instance profile
# and never runs for a pull request: this workflow is triggered only by a finished CI run, and the job
# checks that the run was a push (or a manual dispatch) on main of THIS repository, not a fork's PR.
# Checks out the commit CI built, so the Compose file and the image always belong together.
name: cd

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd
  cancel-in-progress: false  # let a running deploy finish; the next one queues behind it

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, lab-app]
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read  # pull the image CI pushed
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: What is running now (the rollback target)
        run: docker inspect --format '{{.Config.Image}}' lab-app-app-1 2>/dev/null || echo "nothing running yet"
      - name: Deploy
        run: |
          export IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          export IMAGE_TAG="sha-${HEAD_SHA::7}"  # the tag scheme from ci.yaml
          docker compose -f deploy/compose.app.yaml pull
          docker compose -f deploy/compose.app.yaml up -d --wait --remove-orphans
          docker compose -f deploy/compose.app.yaml ps
      - name: Smoke test through Traefik
        run: |
          for _ in $(seq 1 20); do curl -fsS http://localhost/version >/dev/null && break; sleep 2; done
          curl -fsS http://localhost/version | tee /dev/stderr | jq -e --arg sha "$HEAD_SHA" '.git_sha == $sha'
          good='{"pickup_zone_id": 132, "dropoff_zone_id": 230, "pickup_datetime": "2024-03-08T17:05:00"}'
          curl -fsS -X POST http://localhost/predict -H 'Content-Type: application/json' -d "$good" |
            jq -e '.duration_minutes > 0'
          bad='{"pickup_zone_id": 264, "dropoff_zone_id": 230, "pickup_datetime": "2024-03-08T17:05:00"}'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/predict -H 'Content-Type: application/json' -d "$bad")
          [ "$code" = 422 ] || { echo "expected 422 for an invalid zone, got $code" >&2; exit 1; }
      - name: Show the stack when something failed
        if: failure()
        run: |
          docker compose -f deploy/compose.app.yaml ps -a || true
          docker compose -f deploy/compose.app.yaml logs --tail 40 || true
      - name: Remove the registry login from the host
        if: always()
        run: docker logout ghcr.io
