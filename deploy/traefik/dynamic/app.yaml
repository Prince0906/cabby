# Every request goes to the app service, except /metrics: that is for Alloy on the Docker network (S5),
# never for the public entrypoint. S3 adds weighted services for blue-green here.
http:
  routers:
    app:
      rule: PathPrefix(`/`) && !PathPrefix(`/metrics`)
      entryPoints: [web]
      service: app
  services:
    app:
      loadBalancer:
        servers:
          - url: http://app:8000
        healthCheck:
          path: /healthz
          interval: 10s
          timeout: 3s
